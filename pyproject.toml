[project]
name = "mipt-homeworks-2025"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofile>=3.9.0",
    "fastapi>=0.125.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.12.0",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.19.1",
    "types-aiofiles>=25.1.0.20251011",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
